# =====================================================================
# 超高空姿态机动：CMG 辅助统一 MPC 对比实验（方案 §2 / §10）
# =====================================================================
# 本文件是这套实验的**唯一参数源**（common + modes + cases）。方案 §10 里的
# M1..M6_*.yaml 都是"工况指针"文件（`base: common.yaml` + `selected_case`），
# 避免把同一份飞行器/控制器参数抄六遍。
#
# 任务（方案 §3）：
#   * 沿用项目现有弹道：30 km 起飞，顶点 100 km 出现在 t = period/2 = 120 s；
#     机动在约 100 km 处触发（t0 = 118 s，顶点前 2 s，与既有机动工况一致）。
#   * 参考姿态：机动前为配平姿态，五次多项式 s(τ)=10τ³−15τ⁴+6τ⁵ 过渡到
#     θ0+Δθ 并保持（`shape: hold`，即项目已有的 quintic 机动）。
#   * 外部扰动：主机动实验**零扰动**（方案 §3.3：主实验不使用持续偏置）。
#   * A/B 只差执行机构（modes 块）：A 在真值模型和控制器中都关闭 CMG。
#
#   python scripts/validate_maneuver_feasibility.py           # 可行性扫描
#   python scripts/run_cmg_maneuver_ab.py --case M1_pitch_5deg M2_pitch_10deg
#   python scripts/evaluate_cmg_maneuver.py
#   python scripts/plot_cmg_maneuver.py
# =====================================================================
base: ../../config.yaml

common:
  environment:
    backend: msis2
  simulation:
    dt_plant: 0.005
    dt_ctrl: 0.2
  trajectory:
    h0: 30000.0
    period: 240.0          # 顶点时刻 t = 120 s
    V0: 4000.0
    dVdt: 4.0
    alpha_trim_deg: 2.0
  trajectory3:
    dist_scale_qinf: false
    dist_pulse_amp: [0.0, 0.0, 0.0]
    dist_pulse_start: 1.0e9
    dist_pulse_duration: 1.5
    heading_deg: 5.0
    heading_amp_deg: 0.0
    heading_period: 200.0
    high_window_km: 90.0
    maneuver: []
  vehicle3:
    # 方案 §3.3：主机动实验零外部扰动力矩
    Md0: [0.0, 0.0, 0.0]
    Md_amp: [0.0, 0.0, 0.0]
    Md_freq: [0.03, 0.05, 0.04]
  cmg:
    n: 4
    beta_deg: 54.7356
    h0: 50.0
    gdot_max: 1.5
    gddot_max: 10.0
    tau_g: 0.03
    sigma_floor_frac: 0.30
  # 与 C1 正式 A/B 完全相同的冻结权重/预算（不针对本实验调参）
  mpc_cmg:
    q_att: 4000.0
    q_rate: 50.0
    r_delta: 1.0
    r_cmg_transient: 0.05
    r_cmg_trim: 0.50
    e_thresh_deg: 0.5
    M_cmg_box: 61.0
    H_lim_frac: 0.30
    H_planner_max: 50.0
    w_gamma: 5.0
    w_H: 3.0e-3
    q_unload_min: 40.0
    s_delta: 10.0
    rho_sing: 10000.0
    terminal_scale: 10.0
    n_sqp: 2
    k_att: 4.0
    k_rate: 4.0
    k_unload: 0.05
    torque_margin: 0.8
    sigma_margin: 1.15
    horizon:
      - {n: 6, dt: 0.2}
      - {n: 4, dt: 0.5}
      - {n: 4, dt: 1.0}

modes:
  A:
    label: "A 仅气动舵面（真值与控制器均关闭 CMG）"
    actuators: {mode: surface_only}
  B:
    label: "B 气动舵面 + CMG（统一 MPC 联合优化）"
    actuators: {mode: surface_cmg}

cases:

  # ---------------- 主实验（第一阶段） ---------------------------------
  M1_pitch_5deg:
    label: "M1 100 km 顶点，5° 俯仰五次多项式机动 @118 s / 20 s"
    scenario: {name: M1_pitch_5deg, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 5.0, shape: hold}

  M2_pitch_10deg:
    label: "M2 100 km 顶点，10° 俯仰五次多项式机动 @118 s / 20 s"
    scenario: {name: M2_pitch_10deg, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 10.0, shape: hold}

  # ---------------- 阶跃参考（本次改版：不要斜坡） -----------------------
  # 阶跃 = 在 t0 时刻把参考姿态直接跳到 θ0+Δθ 并保持，考的是"最快能多快到位"。
  # duration 不再代表斜坡长度，只用于固定评价窗口 [t0, t0+duration+30 s]。
  M1_step_5deg:
    label: "M1-step 100 km 顶点，5° 俯仰阶跃参考 @118 s"
    scenario: {name: M1_step_5deg, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 5.0, shape: step}

  M2_step_10deg:
    label: "M2-step 100 km 顶点，10° 俯仰阶跃参考 @118 s"
    scenario: {name: M2_step_10deg, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 10.0, shape: step}

  M3_step_15deg:
    label: "M3-step 100 km 顶点，15° 俯仰阶跃参考 @118 s（能力边界）"
    scenario: {name: M3_step_15deg, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 15.0, shape: step}

  # 诊断臂：把同一个 10° 阶跃推迟到 t0=125 s，用来验证"QP 失效是不是由预测时域
  # 提前看到阶跃"引起的（预测时域 7.2 s，故若成立，首次回退应出现在 ~117.8 s）
  M2_step_10deg_late:
    label: "诊断：10° 阶跃推迟到 t0=125 s（验证预测时域预览效应）"
    scenario: {name: M2_step_10deg_late, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 125.0, duration: 20.0, delta_deg: 10.0, shape: step}

  # ---------------- 扩展（第二阶段，M1/M2 验收后再跑） -------------------
  M3_pitch_15deg:
    label: "M3 100 km 顶点，15° 俯仰机动 @118 s / 20 s（能力边界）"
    scenario: {name: M3_pitch_15deg, vertex_km: 100.0, T: 200.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 15.0, shape: hold}

  M4_three_axis:
    label: "M4 100 km 顶点，三轴耦合机动 5°/5°/3° @118 s / 20 s"
    scenario: {name: M4_three_axis, vertex_km: 100.0, T: 200.0}
    trajectory3:
      heading_amp_deg: 3.0
      maneuver:
        - {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 5.0, shape: hold}
        - {axis: roll, start: 118.0, duration: 20.0, delta_deg: 5.0, shape: hold}
        - {axis: yaw, start: 118.0, duration: 20.0, delta_deg: 3.0, shape: hold}

  M5_h90_pitch_5deg:
    extends: M1_pitch_5deg
    label: "M5-90 90 km 顶点，5° 俯仰机动（气动权限更高）"
    scenario: {name: M5_h90_pitch_5deg, vertex_km: 90.0, T: 200.0}

  M5_h110_pitch_5deg:
    extends: M1_pitch_5deg
    label: "M5-110 110 km 顶点，5° 俯仰机动（气动权限更低）"
    scenario: {name: M5_h110_pitch_5deg, vertex_km: 110.0, T: 200.0}

  M6_transient_disturbance:
    extends: M1_pitch_5deg
    label: "M6 100 km，5° 机动 + 零均值 1.5 s 力矩脉冲 @130 s（瞬态扰动）"
    scenario: {name: M6_transient_disturbance, vertex_km: 100.0, T: 200.0}
    trajectory3:
      dist_pulse_amp: [0.0, 40.0, 0.0]
      dist_pulse_start: 130.0
      dist_pulse_duration: 1.5
