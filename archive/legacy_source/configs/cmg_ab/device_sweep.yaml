# =====================================================================
# 装置替换实验：C 组（俯仰任务）/ T 组（三轴任务）改用 CMG（反作用轮已弃用）
# =====================================================================
# 结构：base（工程参数） + common（两组共享） + cases（两组历史任务）
#       + arms（见 nearspace/arms.py）
#
#   python scripts/run_device_sweep.py --case cseries --arms C1 C3_rw C3_cmg
#   python scripts/run_device_sweep.py --all --jobs 4
#
# 与 A/B 主实验（configs/cmg_ab/matrix.yaml）的关系：
#   * 任务、参考、扰动、评分口径完全独立，是**另一组**实验；
#   * 控制权重与主实验冻结值一致，便于横向比较。
# =====================================================================
base: ../../config.yaml

common:
  environment:
    backend: msis2
  simulation:
    dt_plant: 0.005
    dt_ctrl: 0.2
  trajectory:
    h0: 30000.0
    period: 240.0
    V0: 4000.0
    dVdt: 4.0
    alpha_trim_deg: 2.0
  trajectory3:
    dist_scale_qinf: true
    dist_pulse_amp: [0.0, 0.0, 0.0]
    dist_pulse_start: 1.0e9
    dist_pulse_duration: 1.5
    heading_deg: 5.0
    heading_amp_deg: 0.0
    heading_period: 200.0
    maneuver: []
  # 注：早期 C/T 组用的反作用轮已弃用，其代码与数据在 legacy/ 与 results/legacy_rw/
  vehicle3:
    Jw: 0.7
    Omega_max_rpm: 5000.0
    M_stall: 60.0
    P_max: 12000.0
  # CMG 装置：4 单元单框架金字塔，50 N·m·s/单元
  cmg:
    n: 4
    beta_deg: 54.7356
    h0: 50.0
    gdot_max: 1.5
    gddot_max: 10.0
    tau_g: 0.03
    sigma_floor_frac: 0.30
  # 与主实验一致的冻结权重
  mpc_cmg:
    q_att: 4000.0
    q_rate: 50.0
    r_delta: 1.0
    r_cmg_transient: 0.05
    r_cmg_trim: 0.50
    e_thresh_deg: 0.5
    M_cmg_box: 61.0
    H_lim_frac: 0.30
    H_planner_max: 50.0
    w_gamma: 5.0
    w_H: 3.0e-3
    q_unload_min: 40.0
    s_delta: 10.0
    rho_sing: 10000.0
    terminal_scale: 10.0
    n_sqp: 2
    k_att: 4.0
    k_rate: 4.0
    k_unload: 0.05
    torque_margin: 0.8
    sigma_margin: 1.15
    horizon:
      - {n: 6, dt: 0.2}
      - {n: 4, dt: 0.5}
      - {n: 4, dt: 1.0}
  mpc3:
    r_gdot: 1.0e-4
    w_gamma: 1.0
    w_H: 5.0e-4
    rho_sing: 1000.0
    k_unload: 0.05
    q_att: 4000.0
    q_rate: 50.0
    w_h: 5.0e-4
    r_delta: 1.0
    r_tau: 1.0e-4
    s_delta: 10.0
    s_tau: 1.0e-3
    terminal_scale: 10.0
    n_sqp: 1
    horizon:
      - {n: 8, dt: 0.2}
      - {n: 6, dt: 0.5}
      - {n: 6, dt: 1.0}

cases:

  # C 组：俯仰 5° 余弦脉冲机动 @105 s，持续 10 s（原 trajectory: maneuver_*）
  cseries:
    label: "C 组：100 km 顶点，俯仰 5° 脉冲机动 @105 s / 10 s"
    scenario: {name: cseries, vertex_km: 100.0, T: 200.0}
    trajectory3:
      heading_amp_deg: 0.0
      maneuver:
        - {axis: pitch, start: 105.0, duration: 10.0, delta_deg: 5.0, shape: bump}

  # T 组：5° 俯仰 + 5° 滚转 + 3° 偏航余弦脉冲机动 @110 s，持续 20 s
  tseries:
    label: "T 组：100 km 顶点，5° 俯仰 + 5° 滚转 + 3° 偏航脉冲 @110 s / 20 s"
    scenario: {name: tseries, vertex_km: 100.0, T: 150.0}
    trajectory3:
      heading_amp_deg: 3.0
      maneuver:
        - {axis: pitch, start: 110.0, duration: 20.0, delta_deg: 5.0, shape: bump}
        - {axis: roll,  start: 110.0, duration: 20.0, delta_deg: 5.0, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 20.0, delta_deg: 3.0, shape: bump}

  tseries_s60:
    extends: tseries
    label: "T 组 0.6 幅（3°/3°/1.8°）：理论需求 ≈ 83 N·m·s"
    scenario: {name: tseries_s60, vertex_km: 100.0, T: 150.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 110.0, duration: 20.0, delta_deg: 3.0, shape: bump}
        - {axis: roll,  start: 110.0, duration: 20.0, delta_deg: 3.0, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 20.0, delta_deg: 1.8, shape: bump}

  tseries_s40:
    extends: tseries
    label: "T 组 0.4 幅（2°/2°/1.2°）：理论需求 ≈ 56 N·m·s（≈ 预算 60）"
    scenario: {name: tseries_s40, vertex_km: 100.0, T: 150.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 110.0, duration: 20.0, delta_deg: 2.0, shape: bump}
        - {axis: roll,  start: 110.0, duration: 20.0, delta_deg: 2.0, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 20.0, delta_deg: 1.2, shape: bump}

  tseries_s25:
    extends: tseries
    label: "T 组 0.25 幅（1.25°/1.25°/0.75°）：理论需求 ≈ 35 N·m·s"
    scenario: {name: tseries_s25, vertex_km: 100.0, T: 150.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 110.0, duration: 20.0, delta_deg: 1.25, shape: bump}
        - {axis: roll,  start: 110.0, duration: 20.0, delta_deg: 1.25, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 20.0, delta_deg: 0.75, shape: bump}

  tseries_h50:
    extends: tseries
    label: "T 组满幅 + 动量预算放宽到 50%（100 N·m·s）"
    scenario: {name: tseries_h50, vertex_km: 100.0, T: 150.0}
    mpc_cmg: {H_lim_frac: 0.50}

  # 同样的角度、把机动时间拉长：需求 ∝ 1/Tm，俯仰轴需求
  # Tm=30 → 77.7 N·m·s（低于单轴硬件 107.7）、Tm=40 → 58.2。
  tseries_t30:
    extends: tseries
    label: "T 组满幅 5°/5°/3°，Tm = 30 s（需求 ≈ 93 N·m·s）"
    scenario: {name: tseries_t30, vertex_km: 100.0, T: 175.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 110.0, duration: 30.0, delta_deg: 5.0, shape: bump}
        - {axis: roll,  start: 110.0, duration: 30.0, delta_deg: 5.0, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 30.0, delta_deg: 3.0, shape: bump}

  tseries_t40:
    extends: tseries
    label: "T 组满幅 5°/5°/3°，Tm = 40 s（需求 ≈ 70 N·m·s）"
    scenario: {name: tseries_t40, vertex_km: 100.0, T: 185.0}
    trajectory3:
      maneuver:
        - {axis: pitch, start: 110.0, duration: 40.0, delta_deg: 5.0, shape: bump}
        - {axis: roll,  start: 110.0, duration: 40.0, delta_deg: 5.0, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 40.0, delta_deg: 3.0, shape: bump}

  # ---------------------------------------------------------------------
  # C 组「同条件」对照：原 C0-C4 是俯仰单轴模型，扰动为
  #   Md = 20 + 15·sin(2π·0.05t)  N·m，且**不按动压缩放**
  # 而 6 自由度管线默认 vehicle3.Md0 = 0.5 N·m 且 dist_scale_qinf: true，
  # 所以 cseries 的 C1 只有 0.47°，单轴 C1 是 10.41°——两者不可比。
  # 这里把 6 自由度工况的扰动改成与单轴完全一致，再放入 CMG。
  # ---------------------------------------------------------------------
  cseries_pitchdist:
    extends: cseries
    label: "C 组同条件：俯仰 20 N·m 恒定 + 15 N·m 振荡扰动（不按动压缩放）"
    scenario: {name: cseries_pitchdist, vertex_km: 100.0, T: 200.0}
    trajectory3:
      dist_scale_qinf: false
      dist_pulse_amp: [0.0, 0.0, 0.0]
    vehicle3:
      Md0: [0.2, 20.0, 0.3]
      Md_amp: [4.0, 15.0, 6.0]
      Md_freq: [0.03, 0.05, 0.04]

arms:
  cseries: [C0, C1, C2, C3, C4]
  tseries: [T1, T3]
  cseries_pitchdist: [C1, C3, C4]

  # ---------------------------------------------------------------------
  # T 组难度扫描。满幅需求 ≈ 139 N·m·s（俯仰 116.5 / 偏航 74.0 / 滚转 16.4），
  # 其中俯仰一项就已超过 CMG 单轴硬件可用量 107.7，也超过控制器预算 60。
  # 按幅度缩放 s 把需求降到 0.6 / 0.4 / 0.25 倍，找出 CMG 不发散的边界。
  # ---------------------------------------------------------------------
  tseries_s60: [T1, T3]
  tseries_s40: [T1, T3]
  tseries_s25: [T1, T3]
  # 满幅、动量预算从 30% 放宽到 50%（60 → 100 N·m·s）：区分"预算太小"与
  # "硬件容量 / 近奇异"。按 §7.3 的要求，控制器预算与硬件极限必须分开报告。
  tseries_h50: [T1, T3]
  tseries_t30: [T1, T3]
  tseries_t40: [T1, T3]
