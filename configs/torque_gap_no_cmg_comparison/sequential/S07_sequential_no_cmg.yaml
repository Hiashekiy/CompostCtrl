# A arm of S07_sequential (Pitch +30 deg then Pitch -30 deg).
# A group: the vehicle carries NO CMG.  There is no gimbal state, no gimbal
# rate input, no CMG torque and no rotor-momentum gyroscopic coupling in
# either the optimiser or the truth plant (7 states / 3 inputs).
# Everything else is inherited from scenarios/S07_sequential.yaml; see
# scripts/audit_no_cmg_configs.py for the automatic A/B difference audit.
base: ../scenarios/S07_sequential.yaml
torque_gap:
  cmg_present: false
  cmg_enabled: false
