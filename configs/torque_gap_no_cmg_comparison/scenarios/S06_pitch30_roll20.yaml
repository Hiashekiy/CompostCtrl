# Pitch +30 deg and Roll +20 deg together, hold  --  S06_pitch30_roll20
# The single definition of this scenario: window 90-150 s and the
# reference manoeuvre(s).  The A/B case files are generated from this file, so
# both arms share the physics byte for byte.
base: ../base.yaml
torque_gap:
  start: 90.0
  end: 150.0
trajectory3:
  maneuver:
    - {axis: pitch, start: 110.0, duration: 20.0, delta_deg: 30.0, shape: hold}
    - {axis: roll, start: 110.0, duration: 20.0, delta_deg: 20.0, shape: hold}
