# =====================================================================
# 装置替换实验：把 C 组（俯仰任务）/ T 组（三轴任务）里的反作用轮换成 CMG
# =====================================================================
# 结构：base（工程参数） + common（两组共享） + cases（两组历史任务）
#       + arms（见 nearspace/arms.py）
#
#   python scripts/run_device_sweep.py --case cseries --arms C1 C3_rw C3_cmg
#   python scripts/run_device_sweep.py --all --jobs 4
#
# 与 A/B 主实验（configs/cmg_ab/matrix.yaml）的关系：
#   * 任务、参考、扰动、评分口径完全独立，是**另一组**实验；
#   * 控制权重与主实验冻结值一致，便于横向比较。
# =====================================================================
base: ../../config.yaml

common:
  environment:
    backend: msis2
  simulation:
    dt_plant: 0.005
    dt_ctrl: 0.2
  trajectory:
    h0: 30000.0
    period: 240.0
    V0: 4000.0
    dVdt: 4.0
    alpha_trim_deg: 2.0
  trajectory3:
    dist_scale_qinf: true
    dist_pulse_amp: [0.0, 0.0, 0.0]
    dist_pulse_start: 1.0e9
    dist_pulse_duration: 1.5
    heading_deg: 5.0
    heading_amp_deg: 0.0
    heading_period: 200.0
    maneuver: []
  # 反作用轮装置（原 C/T 组所用）：3 正交轮，60 N·m / 366.5 N·m·s / 12 kW
  vehicle3:
    Jw: 0.7
    Omega_max_rpm: 5000.0
    M_stall: 60.0
    P_max: 12000.0
  # CMG 装置：4 单元单框架金字塔，50 N·m·s/单元
  cmg:
    n: 4
    beta_deg: 54.7356
    h0: 50.0
    gdot_max: 1.5
    gddot_max: 10.0
    tau_g: 0.03
    sigma_floor_frac: 0.30
  # 与主实验一致的冻结权重
  mpc_cmg:
    q_att: 4000.0
    q_rate: 50.0
    r_delta: 1.0
    r_cmg_transient: 0.05
    r_cmg_trim: 0.50
    e_thresh_deg: 0.5
    M_cmg_box: 61.0
    H_lim_frac: 0.30
    H_planner_max: 50.0
    w_gamma: 5.0
    w_H: 3.0e-3
    q_unload_min: 40.0
    s_delta: 10.0
    rho_sing: 10000.0
    terminal_scale: 10.0
    n_sqp: 2
    k_att: 4.0
    k_rate: 4.0
    k_unload: 0.05
    torque_margin: 0.8
    sigma_margin: 1.15
    horizon:
      - {n: 6, dt: 0.2}
      - {n: 4, dt: 0.5}
      - {n: 4, dt: 1.0}
  mpc3:
    r_gdot: 1.0e-4
    w_gamma: 1.0
    w_H: 5.0e-4
    rho_sing: 1000.0
    k_unload: 0.05
    q_att: 4000.0
    q_rate: 50.0
    w_h: 5.0e-4
    r_delta: 1.0
    r_tau: 1.0e-4
    s_delta: 10.0
    s_tau: 1.0e-3
    terminal_scale: 10.0
    n_sqp: 1
    horizon:
      - {n: 8, dt: 0.2}
      - {n: 6, dt: 0.5}
      - {n: 6, dt: 1.0}

cases:

  # C 组：俯仰 5° 余弦脉冲机动 @105 s，持续 10 s（原 trajectory: maneuver_*）
  cseries:
    label: "C 组：100 km 顶点，俯仰 5° 脉冲机动 @105 s / 10 s"
    scenario: {name: cseries, vertex_km: 100.0, T: 200.0}
    trajectory3:
      heading_amp_deg: 0.0
      maneuver:
        - {axis: pitch, start: 105.0, duration: 10.0, delta_deg: 5.0, shape: bump}

  # T 组：5° 俯仰 + 5° 滚转 + 3° 偏航余弦脉冲机动 @110 s，持续 20 s
  tseries:
    label: "T 组：100 km 顶点，5° 俯仰 + 5° 滚转 + 3° 偏航脉冲 @110 s / 20 s"
    scenario: {name: tseries, vertex_km: 100.0, T: 150.0}
    trajectory3:
      heading_amp_deg: 3.0
      maneuver:
        - {axis: pitch, start: 110.0, duration: 20.0, delta_deg: 5.0, shape: bump}
        - {axis: roll,  start: 110.0, duration: 20.0, delta_deg: 5.0, shape: bump}
        - {axis: yaw,   start: 110.0, duration: 20.0, delta_deg: 3.0, shape: bump}

arms:
  cseries: [C0_rw, C0_cmg, C1, C2_cmg, C3_rw, C3_cmg, C4_cmg]
  tseries: [T1, T3_rw, T3_cmg]
