# =====================================================================
# CMG 协同姿态控制 —— A/B 实验矩阵
# =====================================================================
# 结构：base（完整工程参数） + common（所有 A/B 工况共享） + cases（任务）
#       + modes（执行机构模式）。A 与 B 只在 `modes` 块里不同，其余字段由
#       common/case 唯一给出，因此不可能出现"给 A/B 用不同扰动或不同初值"
#       的意外差异（实施方案 §3.3）。
#
#   python scripts/run_cmg_ab.py --case tracking --modes A B
#   python scripts/run_cmg_ab.py --all
#
# 每次运行都会把解析后的完整配置写进结果目录的 config_resolved.yaml。
# =====================================================================
base: ../../config.yaml

# ---------------------------------------------------------------------
# 所有工况共享：飞行器、大气、弹道、控制器权重、评分常数
# ---------------------------------------------------------------------
common:
  environment:
    backend: msis2
  simulation:
    dt_plant: 0.005
    dt_ctrl: 0.2
  trajectory:
    h0: 30000.0
    period: 240.0          # 顶点时刻 t = period/2 = 120 s
    V0: 4000.0
    dVdt: 4.0
    alpha_trim_deg: 2.0
  trajectory3:
    dist_scale_qinf: true
    dist_pulse_amp: [0.0, 0.0, 0.0]
    dist_pulse_start: 1.0e9
    dist_pulse_duration: 1.5
    heading_deg: 5.0
    heading_amp_deg: 0.0   # 名义航向：常值，避免额外的偏航参考机动
    heading_period: 200.0
    maneuver:
      axis: pitch
      start: 1.0e9
      duration: 10.0
      delta_deg: 0.0
  mpc_cmg:
    # 权重最终值由 §7.2 权重扫描确定，取 `wscan_*` 系列的结果，见
    # docs/CMG-权重与动量约束核验.md。这里给出的是扫描后的冻结值：
    # r_cmg_transient = 0.05 是"OSQP 状态仍为 solved"的最小可用权重，
    # 0.01 及以下会让瞬态分支打满 20000 次迭代（单步 1.36 s），不可接受。
    q_att: 4000.0
    q_rate: 50.0
    r_delta: 1.0
    r_cmg_transient: 0.05
    r_cmg_trim: 0.50
    e_thresh_deg: 0.5
    M_cmg_box: 61.0
    H_lim_frac: 0.30
    H_planner_max: 50.0
    w_gamma: 5.0
    w_H: 3.0e-3
    q_unload_min: 40.0
    s_delta: 10.0
    rho_sing: 10000.0
    terminal_scale: 10.0
    n_sqp: 2
    k_att: 4.0
    k_rate: 4.0
    k_unload: 0.05
    torque_margin: 0.8
    sigma_margin: 1.15
    horizon:
      - {n: 6, dt: 0.2}
      - {n: 4, dt: 0.5}
      - {n: 4, dt: 1.0}

# ---------------------------------------------------------------------
# 执行机构模式（唯一的 A/B 差异）
# ---------------------------------------------------------------------
modes:
  A:
    label: "A 仅气动舵面"
    actuators: {mode: surface_only}
  B:
    label: "B 气动舵面 + CMG"
    actuators: {mode: surface_cmg}

# ---------------------------------------------------------------------
# 任务
# ---------------------------------------------------------------------
cases:

  # E1-A 名义三轴跟踪（无外部扰动、无指令机动）
  tracking:
    label: "E1-A 名义跟踪 100 km"
    scenario: {name: tracking, vertex_km: 100.0, T: 150.0}

  # E1-B 三轴外部扰动跟踪：复用项目既有俯仰脉冲 80 N·m / 1.5 s @ 112 s
  disturbance:
    label: "E1-B 俯仰脉冲扰动 120 N·m·s @112 s, 100 km"
    scenario: {name: disturbance, vertex_km: 100.0, T: 145.0}
    trajectory3:
      dist_pulse_amp: [0.0, 80.0, 0.0]
      dist_pulse_start: 112.0
      dist_pulse_duration: 1.5

  # E1-B2 三轴耦合扰动：按各轴惯量与气动权限缩放，不是简单地三轴同为 80 N·m
  disturbance3:
    label: "E1-B2 三轴耦合扰动, 100 km"
    scenario: {name: disturbance3, vertex_km: 100.0, T: 145.0}
    trajectory3:
      dist_pulse_amp: [12.0, 80.0, 20.0]
      dist_pulse_start: 112.0
      dist_pulse_duration: 1.5

  # E2 100 km 顶点俯仰突发机动（Tm 由可行性检查选定，见 §5.2）
  maneuver10:
    label: "E2 100 km 顶点俯仰机动 10 deg"
    scenario: {name: maneuver10, vertex_km: 100.0, T: 170.0}
    trajectory3:
      maneuver: {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 10.0}

  maneuver20:
    label: "E2 100 km 顶点俯仰机动 20 deg"
    scenario: {name: maneuver20, vertex_km: 100.0, T: 170.0}
    trajectory3:
      maneuver: {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 20.0}

  # E3 高度敏感性：同一姿态变化，不同高度
  h90_maneuver10:
    extends: maneuver10
    label: "E3-90 90 km 俯仰机动 10 deg"
    scenario: {name: h90_maneuver10, vertex_km: 90.0, T: 170.0}
    trajectory3:
      maneuver: {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 10.0}

  h115_maneuver10:
    extends: maneuver10
    label: "E3-115 115 km 俯仰机动 10 deg（能力边界/局限实验）"
    scenario: {name: h115_maneuver10, vertex_km: 115.0, T: 170.0}
    trajectory3:
      maneuver: {axis: pitch, start: 118.0, duration: 20.0, delta_deg: 10.0}

  # -------------------------------------------------------------------
  # §7.2 CMG 代价权重扫描：固定一个代表性场景（E1-B 扰动工况）
  # -------------------------------------------------------------------
  wscan_0p5:
    extends: disturbance
    label: "权重扫描 r_cmg = 0.5（原配置）"
    scenario: {name: wscan_0p5, vertex_km: 100.0, T: 145.0}
    mpc_cmg: {r_cmg_transient: 0.5, r_cmg_trim: 0.5}

  wscan_0p05:
    extends: disturbance
    label: "权重扫描 r_cmg = 0.05"
    scenario: {name: wscan_0p05, vertex_km: 100.0, T: 145.0}
    mpc_cmg: {r_cmg_transient: 0.05, r_cmg_trim: 0.5}

  wscan_0p01:
    extends: disturbance
    label: "权重扫描 r_cmg = 0.01"
    scenario: {name: wscan_0p01, vertex_km: 100.0, T: 145.0}
    mpc_cmg: {r_cmg_transient: 0.01, r_cmg_trim: 0.5}

  wscan_0p005:
    extends: disturbance
    label: "权重扫描 r_cmg = 0.005"
    scenario: {name: wscan_0p005, vertex_km: 100.0, T: 145.0}
    mpc_cmg: {r_cmg_transient: 0.005, r_cmg_trim: 0.5}
