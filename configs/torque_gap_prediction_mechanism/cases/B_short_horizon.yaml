# B: short prediction horizon.  Complete task reference is kept (the 30 deg
# pitch manoeuvre at t = 110 s is still in the trajectory), but the OCP can only
# see 5.0 s ahead, so at t = 90 s it sees 90-95 s only.  The manoeuvre first
# enters the window at t = 105 s.
#
# Uniform 25 x 0.2 s grid: the node time step stays equal to dt_ctrl so that
# "shorter horizon" is not mixed with "different sampling density".
base: ../base.yaml
torque_gap:
  horizon:
    - {n: 25, dt: 0.2}
