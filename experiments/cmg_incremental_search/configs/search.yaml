# 构型图与搜索预算（指导实施文件 §5、§7、§12）
#
# max_expansions / max_search_time_ms 是**必填项**：缺失或为 null 时程序启动失败
# （src/config.py:validate），不允许默认无限搜索。数值是初始候选，按 §11 的实时预算
# 在阶段 5 用实测耗时收敛，收敛过程记录在 results/metrics/ 里。

search:
  # 时间展开图与离线搜索
  step_s: 0.5                 # 搜索预测步长（§4.1 候选）
  horizon_s: 30.0             # 预测窗口
  max_expansions: 400         # 每周期节点展开上限
  max_search_time_ms: 60.0    # 每周期**图搜索**时间预算（控制周期 200 ms）
  # 实测代价模型（阶段 4，n=60 层）：约 1.0 ms/节点展开（9 邻居 × 支撑函数筛选），
  # 到达第 60 层至少 60 次展开 ≈ 60 ms；带绕行的路径会超预算并报 timeout。
  # 未来需求整链重算实测 40–56 ms，故按 demand_refresh_s 复用（见下）。
  demand_refresh_s: 1.0       # 未来需求重算周期（已知参考，允许复用并前移窗口）
  predict_substeps: 2         # 需求预测的积分子步（步长 0.5 s 内）

  # 历史路径复用（D 组）
  reuse_path: true
  local_repair_budget_ratio: 0.8
  exploration_budget_ratio: 0.2
  max_full_replans: 3         # 连续修复失败后允许的完整重搜次数

  # 代价权重（J = J_track + lambda_m J_move + lambda_s J_sing + lambda_f J_future）
  lambda_move: 1.0
  lambda_sing: 2.0
  lambda_future: 4.0
  w_near: 1.0                 # 近未来（机动窗口）权重
  w_far: 0.35                 # 远期权重的衰减下限
  tau_scale: 60.0             # 缺口归一化尺度（≈保证力矩）
  feasibility_tol: 30.0       # 只用来否掉"完全无力"的边；缺口本身进代价（阶段 7 结论）

graph:
  angular_step_deg: 10.0      # 参考网格间距（不是单周期允许跳转的角度）
  max_neighbors: 9            # 保持 + 4 个框架角各正反向一步
  local_graph_only: true
  local_radius_deg: 60.0      # 局部图半径

logging:
  save_search_tree_summary: true
